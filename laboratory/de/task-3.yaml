      content: |-
        # Komplexaufgabe 3 - Interrupts

        > Aufgabe 3 kombiniert eine Motorsteuerung mit einer visuellen Ausgabe und nutzt einen Interrupt, um beide Komponenten zu synchronisieren.

        Die vorliegende Arduino-Implementierung zeigt die grundlegende Funktionalität: Ein Schrittmotor mit 2048 Schritten pro Umdrehung führt drei volle Umdrehungen aus. Der Motor wird über einen Treiber (ULN2003) an den Pins 8, 9, 10 und 11 angesteuert. An der breiten Spitze des Zeigers ist ein Magnet befestigt, der einen Sensor auslöst, sobald er darüberfährt. Der Sensor ist an Pin 2 angeschlossen. Die vorliegende Implementierung fragt den Sensor per Polling ab (`0` = Zeiger in der Nähe) und schaltet dann den LED-Ring ein.

        Passen Sie den Code so an, dass der LED-Ring die aktuelle Position des Zeigers anzeigt. Erweitern Sie den Code dazu so, dass der Sensor über einen Interrupt ausgewertet wird:

        + Integrieren Sie eine Interrupt-Service-Routine, die bei einer fallenden Flanke des Sensors aufgerufen wird.
        + Verwenden Sie für die Position des Zeigers die globale Variable `position`. Ihr Wert wird in der Interrupt-Service-Routine auf 0 zurückgesetzt. Vergessen Sie nicht, die Variable als `volatile` zu deklarieren!
        + Bilden Sie den Wert von `position` auf den Wertebereich des LED-Rings (24 LEDs) ab.

        ## Ausgangscode

        ```cpp
        #include <Stepper.h>
        #include <Adafruit_NeoPixel.h>

        // Anzahl der Schritte pro Umdrehung
        #define STEPS      2048
        // Motorgeschwindigkeit in RPM
        #define MOTOR_RPM     6
        Stepper stepper(STEPS, 8, 10, 9, 11); // Motor Pins

        #define PIN           3
        #define NUMPIXELS    24
        Adafruit_NeoPixel pixels(NUMPIXELS, PIN, NEO_GRB + NEO_KHZ800);

        int position = 0;

        void setup()
        {
            pinMode(8, OUTPUT);
            pinMode(9, OUTPUT);
            pinMode(10, OUTPUT);
            pinMode(11, OUTPUT);
            pinMode(11, OUTPUT);
            pinMode(2, INPUT_PULLUP);

            Serial.begin(9600);
            Serial.println("Motor startet");

            pixels.begin();
            pixels.clear();

            stepper.setSpeed(MOTOR_RPM);
            int steps = 8;
            int counter = 0;
            // Generiere 3 Drehungen
            // Überwache den Endlagensensor im Polling Mode und aktiviere den LED Ring
            while (counter < 3 * STEPS) {
                stepper.step(steps);
                position=position+steps;
                if (digitalRead(2) == 0) {
                  for (int i=0; i<NUMPIXELS; i++)
                    pixels.setPixelColor(i, pixels.Color(0, 150, 0));
                  pixels.show();
                } else {
                  pixels.clear();
                  pixels.show();
                }
                counter += 3;
                Serial.println(counter);
            }
            Serial.println("3 Runden absolviert");
        }

        void loop()
        {
        }
        ```
