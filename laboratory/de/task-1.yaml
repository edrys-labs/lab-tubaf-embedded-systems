        # Simulatorübung Aufgabenkomplex B

        Zunächst bereiten Sie die Benutzeroberfläche für die Konfiguration im Simulator vor. Der Quellcode im Simulator stellt Ihnen bereits den Zugriff auf das LCD (16x2) bereit.

        Wie auf der Station ist ein Ultraschallsensor angeschlossen: Trigger an Pin 12, Echo an Pin 11. Den Abstand zum Hindernis stellen Sie mit dem Schieberegler unter der Schaltung ein. Eingaben über die serielle Schnittstelle senden Sie über die Eingabezeile unter dem Terminal des Simulators. Auch die Bibliothek [NewPing](https://bitbucket.org/teckel12/arduino-new-ping/src/master/) steht im Simulator zur Verfügung.

        > **Praktische Aufgabe 1**: Erweitern Sie den Code so, dass Nutzende über Anweisungen auf dem Display angeleitet werden, eine maximale Messdistanz und eine Maßeinheit für die Distanzmessung anzugeben. Testen Sie Ihre Oberfläche mit den Messwerten des simulierten Sensors.

        > **Konzeptionelle Aufgabe 1**: Überlegen Sie insbesondere, welche fehlerhaften Eingaben Nutzende machen können und wie sich diese abfangen lassen.
