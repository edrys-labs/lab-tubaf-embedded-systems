        # Komplexaufgabe 2 - Analog-Digital-Wandler

        > Aufgabe 2 trainiert Ihre Fähigkeiten im Umgang mit dem Analog-Digital-Wandler. Dazu implementieren Sie einen einfachen „Laserscanner“.

        Die vorliegende Arduino-Implementierung zeigt die erwartete Funktionalität: Ein Servomotor schwenkt einen Infrarot-Distanzsensor ([Sharp GP2Y0A02](http://www.pololu.com/file/download/gp2y0a02yk_e.pdf?file_id=0J156)) schrittweise um 180 Grad. Bei jedem Schritt von einem Grad wird eine neue Distanzmessung durchgeführt. Der Distanzsensor ist mit dem Eingang `A0` des Mikrocontrollers verbunden. Der Servomotor wird über ein PWM-Signal an Pin 9 gesteuert; seinen Code müssen Sie nicht anpassen. Die Grafik zeigt die Scans, deren Messwerte allerdings noch nicht in Distanzen umgerechnet sind.

        Folgen Sie den Hinweisen im Code und ersetzen Sie die Arduino-Funktionen durch die entsprechenden avrlibc-Befehle:

        0. Verbessern Sie zunächst die Struktur des Codes, indem Sie die redundanten Codeteile in die Funktion `make_scan` auslagern (siehe Zeile 13). Deklarieren Sie dafür das Servo-Objekt `myservo` global, damit `make_scan` darauf zugreifen kann.
        1. Ersetzen Sie die Konfiguration und Durchführung der analogen Messungen (`analogRead(analogPin)`) durch eine Umsetzung mit `avrlibc`.
        2. Rechnen Sie die Spannungswerte in echte Distanzwerte in $cm$ um.

        Die Visualisierung nutzt ein Array mit 180 Einträgen. Dabei wird der Index als Winkel und der gespeicherte Wert als Distanz interpretiert.

        ## Ausgangscode

        ``` cpp
        #include <Servo.h>

        const int analogPin = A0;
        const int servoPin = 9;

        float calculate_dist_cm(float value){
            // Aufgabe 2: Bilden Sie die digitale Spannungsrepräsentation
            //            auf einen Abstandswert ab
            // TODO
            return value;
        }

        void make_scan(int start, int end, int step){
            // Aufgabe 0: Übernehmen Sie Zeile 37 - 47 und 50 - 60
            //            in eine Funktion
            // TODO
            //
            // Aufgabe 1: Ersetzen Sie die Arduino AnalogRead()
            //            Methode
        }

        void setup() {
            pinMode(analogPin, INPUT);
            pinMode(servoPin, OUTPUT);

            Serial.begin(9600);
            delay(1000);

            Servo myservo;
            myservo.attach(servoPin);

            float val_v = 0;
            float val_cm = 0;

            // Scan right
            int pos = 0;
            for (pos = 0; pos <= 180; pos += 1) {
            myservo.write(pos);
            delay(15);
            val_v = analogRead(analogPin);
            val_cm = calculate_dist_cm(val_v);

            Serial.print("position:");
            Serial.print(pos);
            Serial.print(",distance:");
            Serial.println(val_cm);
            }

            // Scan left
            for (pos = 180; pos >= 0; pos -= 1) {
            myservo.write(pos);
            delay(15);
            val_v = analogRead(analogPin);
            val_cm = calculate_dist_cm(val_v);

            Serial.print("position:");
            Serial.print(pos);
            Serial.print(",distance:");
            Serial.println(val_cm);
            }
        }

        void loop(){
        }
        ```
