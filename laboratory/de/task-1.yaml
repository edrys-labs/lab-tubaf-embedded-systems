      content: |-
        # Remote-Labor (Aufgabenkomplex A)

        > **Praktische Aufgabe 2**: Ergänzen Sie im Programm die Implementierung der Funktion `runUSmeasurement`. Gehen Sie davon aus, dass der Trigger-Pin gemäß den Zeitvorgaben im folgenden Diagramm gesetzt werden muss. Verwenden Sie für die Messung des Zeitintervalls, mit dem der Sensor antwortet, die im Simulator entwickelten Methoden.

        ![Zeitdiagramm des Ultraschallsensors](https://www.researchgate.net/profile/Gavin-Anjitha/publication/341480237/figure/fig2/AS:892805480189952@1589872822526/Timing-Diagram-for-HC-SR04-Ultrasonic-Sensor_W640.jpg)
        *Autor: Gavin Anjitha, „Obstacle avoidance robot using FPGA“*

        > **Praktische Aufgabe 3**: Ergänzen Sie die Implementierung der Funktion `duration2dist_cm`. Welche Annahmen treffen Sie dabei?

        **Ausgangscode für Aufgabenkomplex A**

        ``` cpp   InitialCode.cpp
        const int trigPin = 12;
        const int echoPin = 11;

        // Führt die US Messung aus, Rückgabewert ist die Zeitdauer bis 
        // zum Empfang des Echos
        long runUSmeasurement(int trig, int echo)
        {

          return 1000;
        }

        float duration2dist_cm(long duration)
        {
          return 10000;
        }

        void setup()
        {
          Serial.begin(9600);
          Serial.println("Los geht's");

          pinMode(trigPin, OUTPUT);
          pinMode(echoPin, INPUT);
        }

        void loop() {
          long duration = runUSmeasurement(trigPin, echoPin);
          Serial.println(duration);

          // float distance = duration2dist_cm(duration);
          // Serial.print(distance);
          // Serial.println("cm");
          delay(1000);
        }
        ```
