        # Komplexaufgabe 2 - Analog-Digital-Wandler

        Liebe Teilnehmerinnen und Teilnehmer,

        die zweite Komplexaufgabe baut auf den Grundlagen der ersten auf und vertieft Ihr Verständnis für die Programmierung eingebetteter Systeme.

        Die Aufgaben werden als Remote-Labor angeboten, da die Laboraufbauten von Aufgabe zu Aufgabe umfangreicher werden. Über den Webzugriff können wir die Aufbauten ressourcenschonend und zeiteffizient einsetzen. Sollte dabei einmal etwas nicht wie erwartet funktionieren, geben Sie uns bitte Bescheid.

        Der Laboraufbau kann jeweils nur von einer Person genutzt werden. Prüfen Sie daher bitte vorher, ob die Station gerade von jemand anderem verwendet wird. Die Station behält immer den zuletzt eingegebenen Code. Hinterlassen Sie Ihren Arbeitsplatz deshalb ordentlich und kopieren Sie vor dem Verlassen den Originalcode zurück in den Editor.

        Raum 1 erläutert die Fragestellungen und Lernziele der Aufgabe. In Raum 2 folgt eine Simulatorübung zur Fehlerbehebung. Die praktische Umsetzung am Laboraufbau erfolgt auf der „Station“.

        Die Aufgabe ist so konzipiert, dass Sie die Lösung selbstständig erarbeiten können. Wenn Sie dennoch Fragen haben, wenden Sie sich gern an das Betreuungsteam.

