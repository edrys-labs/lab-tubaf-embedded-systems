      value: |
        #include <avr/io.h>
        #include <util/delay.h>

        void adc_init() {
            // Fehlerhafte Konfiguration: falsche Referenzspannung
            ADMUX = (1 << REFS0); // Fehler: REFS0 allein wählt AVCC (5 V), gefordert ist die interne 1,1-V-Referenz

            // Fehlerhafte Prescaler-Einstellung: Taktfrequenz zu hoch
            ADCSRA = (1 << ADEN) | (1 << ADPS1); // Fehler: Prescaler 4, der ADC-Takt ist zu hoch (empfohlen: 50-200 kHz)
        }

        uint16_t adc_read(uint8_t channel) {
            // Fehlerhafte Kanalwahl: Die Maske 0xF8 löscht nur MUX2..0, Kanäle über 7 werden nicht abgefangen
            ADMUX = (ADMUX & 0xF8) | channel;

            ADCSRA |= (1 << ADSC); 
            while (!(ADCSRA & (1 << ADIF))); // Wartet auf falsches Flag
            return ADC; // Liefert ungenaue Werte
        }

        void setup() {
            Serial.begin(9600);
            adc_init();
        }

        void loop() {
            uint16_t adc_value = adc_read(8); // Fehler: Kanal 8 ist der interne Temperatursensor, das Potentiometer hängt an A0
            float voltage = adc_value * (5.0 / 1023.0); // Fehlerhafte Berechnung mit falscher Referenzspannung

            Serial.print("Voltage: ");
            Serial.print(voltage, 2);
            Serial.println(" V");
            _delay_ms(500);
        }
