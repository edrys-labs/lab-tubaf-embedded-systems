        # Komplexaufgabe 1 - Distanzmessung

        Liebe Teilnehmerinnen und Teilnehmer,

        diese erste Komplexaufgabe gibt Ihnen Gelegenheit, sich ergänzend zu den praktischen Übungen mit den Grundlagen der Programmierung eingebetteter Systeme vertraut zu machen.

        Die Aufgaben werden als Remote-Labor angeboten, da die Laboraufbauten von Aufgabe zu Aufgabe umfangreicher werden. Über den Webzugriff können wir die Aufbauten ressourcenschonend und zeiteffizient einsetzen. Die Umsetzung ist Teil eines Forschungsprojekts, und wir freuen uns über Ihr Feedback.

        > Die Aufgabenstellung umfasst die zwei Aufgabenkomplexe A und B. Aufgabenkomplex A richtet sich vor allem an Studierende mit wenig Programmiererfahrung. Wer bereits mit dem Mikrocontroller vertraut ist, kann die eigenen Fähigkeiten mit Aufgabenkomplex B vertiefen.

        Die Aufgaben sind so konzipiert, dass Sie die Lösung selbstständig erarbeiten können. Wenn Sie dennoch Fragen haben, wenden Sie sich gern an das Betreuungsteam.

        Raum 1 erläutert für beide Aufgabenkomplexe die Fragestellungen und Lernziele. Anschließend bearbeiten Sie für Aufgabenkomplex A den Raum 2 und für Aufgabenkomplex B den Raum 3. Die praktische Umsetzung am Laboraufbau erfolgt in beiden Fällen auf der „Station“.

        > Ihre Codeänderungen werden auf der Station anonymisiert gespeichert. So können wir typische Schwierigkeiten erkennen und die Lehrveranstaltung gezielt weiterentwickeln. Die Daten lassen keine Rückschlüsse auf Ihre Person oder Ihren Rechner zu. Wenn Sie Fragen dazu haben, sprechen Sie uns gern an.

        Wir freuen uns auf Ihr Feedback und Ihre Anregungen.

        _Ihr CrossLab-Team_
