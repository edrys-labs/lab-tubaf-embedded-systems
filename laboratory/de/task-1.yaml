    config:
      content: |-
        # Simulatorübung Aufgabenkomplex A

        Der Ultraschallsensor kommuniziert mit dem Mikrocontroller über eine Abfolge von Spannungswechseln. Über sie wird sowohl der Start einer Messung als auch die Zeitdauer bis zum Empfang des Echos übermittelt. Deshalb beschäftigen wir uns zunächst damit, die Flankenwechsel in den Signalverläufen zu erkennen und die zugehörigen Zeitfenster zu messen.

        An Pin 2 des simulierten Mikrocontrollers ist ein Taster angeschlossen. Das nebenstehende Programm wertet seinen Zustand aus und meldet jeden Zustandswechsel. Das Diagramm „Taster“ unter der Schaltung zeigt den Pegel von Pin 2 über die Zeit, sodass Sie jede Flanke und die Dauer jedes Tastendrucks direkt ablesen können.

        > **Praktische Aufgabe 1**: Ergänzen Sie das Programm um eine Zeitmessung, die erfasst, wie lange der Taster gedrückt wurde. Vergleichen Sie Ihre Messwerte mit dem Diagramm.

        > **Konzeptionelle Aufgabe 1**: Vergleichen Sie anhand der [Dokumentation](https://docs.arduino.cc/language-reference/de/funktionen/time/millis/) die Zeitmessung mit `millis()` und `micros()`. Begründen Sie quantitativ, welche der beiden Funktionen für den Einsatz mit dem Ultraschallsensor geeignet ist.

        ## Vorbereitung auf das Remote-Labor

        Im Simulator ist außerdem ein Ultraschallsensor an denselben Pins wie auf der Station angeschlossen: Trigger an Pin 12, Echo an Pin 11. Der simulierte Sensor (HC-SR04) arbeitet nach demselben Prinzip wie der SRF04 auf der Station. Den Abstand zum Hindernis stellen Sie mit dem Schieberegler unter der Schaltung ein. Das untere Diagramm zeigt bei jeder Messung den Trigger-Puls an Pin 12 und den Echo-Puls an Pin 11.

        > **Tipp**: Entwickeln und testen Sie die Funktionen `runUSmeasurement` und `duration2dist_cm` (Praktische Aufgaben 2 und 3) zuerst hier im Simulator. Den Ausgangscode finden Sie auf der Station. Prüfen Sie, ob die berechnete Distanz mit dem eingestellten Abstand übereinstimmt, bevor Sie Ihren Code auf der Station ausführen.
