    config:
      content: |-
        # Simulatorübung: Fehlerhafte Interrupt-Steuerung

        Mit Interrupts kann ein Mikrocontroller sofort auf externe Ereignisse reagieren, ohne die entsprechenden Pins ständig abfragen zu müssen. Das ist besonders bei zeitkritischen Anwendungen nützlich, etwa beim Umschalten eines Zustands per Tastendruck.

        In dieser Übung schaltet ein Taster an Pin 2 die LED an Pin 13 ein und aus. Ein Interrupt soll dafür sorgen, dass die LED bei jedem Tastendruck ihren Zustand wechselt. Der gegebene Code enthält jedoch Fehler, die Sie beheben müssen.

        > **Aufgabe**: Korrigieren Sie die Fehler im Code, sodass der Interrupt korrekt konfiguriert ist und die LED bei jedem Tastendruck umschaltet.
