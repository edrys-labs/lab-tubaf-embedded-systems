    config:
      content: |-
        # Aufgabeninhalt

        ## Lernziele

        ### Aufgabenkomplex A

        > Entwickeln Sie einen Programmcode, mit dem sich einfache Distanzmessungen mithilfe eines [Ultraschallsensors](https://www.conrad.de/de/ratgeber/industrie-40/ultraschallsensoren.html) umsetzen lassen.

        Im Rahmen dieser Aufgabe

        1. erarbeiten Sie sich Methoden zur systematischen Analyse eines Sensordatenblatts,
        2. setzen Sie die Ansteuerung des Sensors nach den Vorgaben des Datenblatts um und
        3. entwickeln Sie C-Code zur Auswertung der Messungen.

        Dazu arbeiten Sie sich in die Struktur eines Codefragments ein, das auf Arduino-Bibliotheken basiert, und ergänzen die fehlenden Funktionen. Die Ausgabe erfolgt über die serielle Schnittstelle oder wahlweise über das Display.

        > Der Zeitaufwand für diese Aufgabe beträgt etwa 45 Minuten.

        ### Aufgabenkomplex B

        > Entwickeln Sie ein Distanzmesssystem, bei dem sich über die serielle Schnittstelle auswählen lässt, ob die Ausgabe auf dem Display in Zentimetern oder Zoll erfolgt.

        Diese Aufgabe baut vor allem auf der Nutzung bestehender Implementierungen auf. Im Rahmen dieser Aufgabe

        1. arbeiten Sie sich in den Quellcode eines Open-Source-Projekts ein,
        2. erkunden Sie die Programmierschnittstelle der LCD-Bibliothek und
        3. kombinieren Sie die Methoden in einem kleinen Projekt, in dem Nutzende das Messsystem konfigurieren können.

        > Der Zeitaufwand für diese Aufgabe beträgt etwa 45 Minuten.

        ## Technische Basis

        Als eingebettetes System dient ein Mikrocontroller der Firma Atmel (heute Microchip), der auf einem [Arduino Uno Rev3](https://docs.arduino.cc/hardware/uno-rev3/) verbaut ist.

        Grundlage der Aufgabe ist ein einfacher Ultraschallsensor mit zwei Wandlern vom Typ [SRF04](https://datasheetspdf.com/pdf-file/523589/ETC/SRF04/1). Er kann Entfernungen von etwa 3 cm bis 3 m erfassen; in unserer Anwendung wird er für kurze Distanzen bis etwa 50 cm eingesetzt. Zusätzlich ist ein 16x2-Display mit dem Mikrocontroller verbunden.

        | Bauteil                 | Bezeichnung | Elektrische Verbindung                   |
        | ----------------------- | ----------- | ---------------------------------------- |
        | Ultraschallsensor       | SRF04       | 5V, GND, Trigger (Pin 12), Echo (Pin 11) |
        | LCD-Display 16x2        |             | 5V, GND, SCL (Pin 19), SDA (Pin 18)      |
