    config:
      content: |-
        # Aufgabeninhalt

        ## Lernziele

        * Konfiguration und Nutzung des Analog-Digital-Wandlers ohne Arduino-Bibliotheken, über direkte Registerzugriffe (avrlibc)
        * Umrechnung digitaler Spannungswerte in physikalische Größen (Distanz in cm)
        * Strukturierte und wiederverwendbare Programmierung durch Auslagern von Codeteilen in Funktionen
        * Ansteuerung eines Servomotors zur präzisen Positionierung
        * Ausgabe und Speicherung der Messergebnisse

        ## Aufgabenstellung

        Entwickeln Sie einen Programmcode, der die folgenden Anforderungen erfüllt:

        * Implementieren Sie eine Funktion `make_scan`, die den Distanzsensor schrittweise von 0° bis 180° schwenkt und bei jedem Schritt die Distanz misst.
        * Ersetzen Sie die Funktion `analogRead()` durch eine direkte Konfiguration und Nutzung des Analog-Digital-Wandlers (ADC) mit avrlibc.
        * Lesen Sie die digitalen Spannungswerte ein und rechnen Sie sie in Distanzwerte in cm um.
        * Strukturieren Sie Ihren Code, indem Sie redundante Codeteile in Funktionen auslagern.

        ## Technische Basis

        Die Umsetzung erfolgt auf einem Arduino Uno mit den folgenden Komponenten:

        | Bauteil                   | Bezeichnung    | Elektrische Verbindung      |
        | ------------------------- | -------------- | --------------------------- |
        | Distanzsensor (Infrarot)  | Sharp GP2Y0A02 | 5V, GND, Signal (Pin A0)    |
        | Servomotor                |                | PWM-Signal (Pin 9), 5V, GND |

        > Der Zeitaufwand für diese Aufgabe beträgt etwa 90 Minuten.
