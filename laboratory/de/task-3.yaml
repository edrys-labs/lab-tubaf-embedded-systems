    config:
      content: |-
        # Aufgabeninhalt

        ## Lernziele

        * Konfiguration und Nutzung von Interrupts, um externe Ereignisse zu erkennen und darauf zu reagieren
        * Ansteuerung eines Schrittmotors mit präziser Positionsbestimmung
        * Visualisierung der Motorposition auf einem LED-Ring
        * Nutzung globaler `volatile`-Variablen zum Datenaustausch zwischen Hauptprogramm und Interrupt-Service-Routine
        * Strukturierung des Programmcodes durch Auslagern wiederverwendbarer Funktionen

        ## Aufgabenstellung

        Entwickeln Sie einen Programmcode, der die folgenden Anforderungen erfüllt:

        * **Interrupt-Service-Routine (ISR)**: Implementieren Sie eine ISR, die bei einer fallenden Flanke des Sensors (Pin 2) die globale, als `volatile` deklarierte Variable `position` auf 0 setzt.

        * **Ersatz des Pollings**: Entfernen Sie das bisherige Polling im Hauptprogramm und erfassen Sie den Sensorstatus stattdessen effizient über die ISR.

        * **Visualisierung der Motorposition**: Binden Sie den LED-Ring (24 LEDs) ein und bilden Sie den Wert von `position` auf den Wertebereich des LED-Rings ab, um die aktuelle Motorposition anzuzeigen.

        * **Ansteuerung des Schrittmotors**: Lassen Sie den Schrittmotor (2048 Schritte pro Umdrehung) drei volle Umdrehungen ausführen und synchronisieren Sie die LED-Anzeige mit der Motorbewegung.

        ## Technische Basis

        Die Umsetzung erfolgt auf einem Arduino Uno mit den folgenden Komponenten:

        | Bauteil                 | Bezeichnung                 | Elektrische Verbindung       |
        | ----------------------- | --------------------------- | ---------------------------- |
        | Schrittmotor            | 28BYJ-48                    | Pins 8, 9, 10, 11            |
        | Motortreiber            | ULN2003                     | Versorgung des Schrittmotors |
        | Magnetischer Sensor     | Hall-Sensor                 | Pin 2, 5V, GND               |
        | LED-Ring                | Adafruit NeoPixel (24 LEDs) | Pin 3, 5V, GND               |

        > Der Zeitaufwand für diese Aufgabe beträgt etwa 90 Minuten.
