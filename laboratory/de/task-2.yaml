    config:
      content: |-
        # Simulatorübung: Fehlerhafte ADC-Konfiguration

        Der Analog-Digital-Wandler (ADC) des Mikrocontrollers wandelt analoge Spannungen in digitale Werte um, die das restliche System weiterverarbeiten kann. Dies geschieht in einer festen Abfolge aus Konfiguration, Messung und Auswertung. Damit die Messungen zuverlässig funktionieren, muss die richtige Referenzspannung eingestellt, der ADC korrekt initialisiert und das Messergebnis richtig interpretiert werden.

        Wir nehmen an, dass am analogen Pin A0 des Mikrocontrollers ein Potentiometer angeschlossen ist. Der ADC misst die Spannung an diesem Pin, und das Programm gibt die berechneten Werte über die serielle Schnittstelle aus.

        > **Aufgabe**: Das gegebene Programm enthält mehrere Fehler, die Sie beheben sollen. Ziel ist es, mit dem Potentiometer am ADC-Eingang (A0) Spannungen im Bereich von 0 bis 1,1 V zu messen und über die serielle Schnittstelle auszugeben.

        Das Diagramm unter der Schaltung zeigt die Spannung an A0 als Linie und markiert jede Wandlung, die den Kanal A0 misst, mit dem gemessenen Wert. `ADIF` markiert jedes Mal, wenn der ADC das Ende einer Wandlung meldet. Vergleichen Sie vor und nach Ihren Korrekturen: Welcher Kanal wird gemessen, wie oft wird gewandelt, und stimmt die ausgegebene Spannung mit der im Diagramm überein?
