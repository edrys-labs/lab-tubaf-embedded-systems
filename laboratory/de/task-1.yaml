        # Remote-Labor (Aufgabenkomplex B)

        > **Praktische Aufgabe 2**: Verwenden Sie die Bibliothek [NewPing](https://bitbucket.org/teckel12/arduino-new-ping/src/master/) für die objektorientierte Ansteuerung des SRF04-Sensors. Arbeiten Sie sich dazu in die Dokumentation ein und ermitteln Sie die Methoden, die Sie für Distanzmessungen in unterschiedlichen Einheiten benötigen.

        > **Praktische Aufgabe 3**: Binden Sie Ihre Konfigurationsoberfläche ein, sodass Sie zwischen verschiedenen Reichweiten und Ausgabeformaten wählen können. Warum ist die Reichweite ein wichtiger Parameter?

        **Ausgangscode für Aufgabenkomplex B**

        ``` cpp   InitialCode.cpp
        /* * Posted on https://randomnerdtutorials.com * created by http://playground.arduino.cc/Code/NewPing */

        #include <NewPing.h>
        #define TRIGGER_PIN 12
        #define ECHO_PIN 11
        #define MAX_DISTANCE 200

        // NewPing setup of pins and maximum distance
        NewPing sonar(TRIGGER_PIN, ECHO_PIN, MAX_DISTANCE); 
        void setup() {
          Serial.begin(9600);
        }
        void loop() {
          delay(50);
          unsigned int distance = sonar.ping_cm();
          Serial.print(distance);
          Serial.println("cm");
        }
        ```
